<section class="news-paper" dir="rtl">
  <div class="container-custom">
    <h2 class="news-title">Latest News</h2>

    <div class="news-layout">
      <!-- Main News -->
      <article class="news-main hover-lift" *ngIf="latestNews.length > 0" [routerLink]="['/news', latestNews[0].id]">
        <img [src]="latestNews[0].featuredImagePath" [alt]="latestNews[0].title">
        <div class="news-content">

          <!-- <span class="news-category">{{ latestNews[0].postCategories[0]?.categoryName }}</span> -->
          <span class="news-date">{{ formatDate(latestNews[0].publishedDate) }}</span>

          <span class="news-views"><i class="fas fa-eye"></i> Visitors: {{ latestNews[0].totalViewCount }}</span>
          <h3>{{ latestNews[0].title }}</h3>
          <!-- <p>{{ latestNews[0].content|cleanHtml|slice:50}}</p> -->
          <a [routerLink]="['/news', latestNews[0].id]">Read More ←</a>
        </div>
      </article>

      <!-- Side News -->
      <div class="news-side">
        <article 
          *ngFor="let article of latestNews.slice(2)" 
          class="news-item hover-lift"
          [routerLink]="['/news', article.id]"
        >
          <img [src]="article.featuredImagePath" [alt]="article.title">
          <div>
            <span class="news-date">{{ formatDate(article.publishedDate) }}</span>
            <span class="news-views"><i class="fas fa-eye"></i> Visitors: {{ article.totalViewCount }}</span>
            <h4>{{ article.title }}</h4>
            <a [routerLink]="['/news', article.id]">View ←</a>
          </div>
        </article>
      </div>
    </div>
  </div>
</section>
