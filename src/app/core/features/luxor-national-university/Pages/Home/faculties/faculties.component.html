<section class="colleges-section">
  <h2 class="section-title">Colleges & Programs</h2>

  <div class="colleges-grid"  >

    <div class="college-card" *ngFor="let department of departments; let i = index"
      (click)="viewFacultyDetails(department.slug)" [class]="'item-' + (i + 1)">
      <div class="college-bg" ><img 
          *ngIf="department.departmentAttachments && department.departmentAttachments.length > 0"
          [src]="department.departmentAttachments[0]?.url"
          [alt]="department.name"
        ></div>
      
      <div class="college-content">
        <h3 >{{ department.name }}</h3>
        <p class="college-desc" *ngIf="department.subTitle">
          {{ department.subTitle }}
        </p>
      </div>

    </div>
    
  </div>
</section>
